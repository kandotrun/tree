[platformio]
default_envs = m5stack-atom

[env:m5stack-atom]
platform = platformio/espressif32@6.13.0
board = m5stack-atom
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    adafruit/Adafruit NeoPixel@1.15.5

[env:native]
platform = native
test_framework = unity
test_build_src = yes
lib_deps =
    bblanchon/ArduinoJson@7.4.3
build_src_filter =
    +<watering_controller.cpp>
    +<api_contract.cpp>
    +<sensor_filter.cpp>
build_flags =
    -std=gnu++17

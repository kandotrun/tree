name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test LAN API and safety core
        run: swift test --package-path ios
      - name: Test app safety structure
        run: python3 -m unittest discover -s ios/tests -v
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild             -project ios/TreeWatering.xcodeproj             -scheme TreeWatering             -configuration Debug             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             -derivedDataPath ios/build             CODE_SIGNING_ALLOWED=NO             build | tee ios/build.log
      - name: Launch and capture setup screen
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = [
              device
              for runtime in devices.values()
              for device in runtime
              if device.get("isAvailable") and device["name"].startswith("iPhone")
          ]
          if not candidates:
              raise SystemExit("No available iPhone simulator")
          print(candidates[0]["udid"])
          ')"
          xcrun simctl boot "$simulator_id" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_id" -b
          app_path="ios/build/Build/Products/Debug-iphonesimulator/TreeWatering.app"
          test -d "$app_path"
          xcrun simctl install "$simulator_id" "$app_path"
          xcrun simctl launch --terminate-running-process "$simulator_id" run.kan.treewatering
          sleep 2
          xcrun simctl io "$simulator_id" screenshot ios/build/TreeWatering-setup.png
          ditto -c -k --sequesterRsrc --keepParent "$app_path" ios/build/TreeWatering-simulator.zip
          xcrun simctl shutdown "$simulator_id"
      - name: Upload simulator app and screenshot
        uses: actions/upload-artifact@v4
        with:
          name: TreeWatering-simulator
          path: |
            ios/build/TreeWatering-simulator.zip
            ios/build/TreeWatering-setup.png
            ios/build.log
          if-no-files-found: error
          retention-days: 14

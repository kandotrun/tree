name: TreeWatering
options:
  bundleIdPrefix: run.kan
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  TreeCore:
    path: .

targets:
  TreeWatering:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TreeWatering
        excludes:
          - Resources
    resources:
      - path: TreeWatering/Resources
    dependencies:
      - package: TreeCore
    info:
      path: TreeWatering/Info.plist
      properties:
        CFBundleDisplayName: 木のみず
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: ベランダの水やり端末へ直接接続して、状態確認と給水操作を行います。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.kan.treewatering
        PRODUCT_NAME: TreeWatering
        SWIFT_VERSION: "5.10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  TreeWatering:
    build:
      targets:
        TreeWatering: all
    run:
      config: Debug
    archive:
      config: Release

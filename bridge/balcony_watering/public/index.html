<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8eddf">
  <meta name="description" content="ベランダの木に、10秒だけ水をあげられます。">
  <title>みんなの水やり | tree.2-38.com</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body data-state="loading">
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="tree.2-38.com ホーム">
        <span>TREE</span><small>2-38</small>
      </a>
      <p id="connection-label" class="connection">接続中</p>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="kicker">みんなの水やり</p>
        <h1 id="page-title">木に、<em>ひとくち。</em></h1>
        <p class="intro-copy">ボタンを押すと、ベランダの木に10秒だけ水が流れます。</p>
      </section>

      <section class="watering-console" aria-label="水やり操作">
        <div class="plant-stage" aria-hidden="true">
          <div class="stem"></div>
          <div class="leaf leaf-left"></div>
          <div class="leaf leaf-right"></div>
          <div class="soil"></div>
          <div class="water-line"></div>
        </div>

        <div class="status-panel">
          <p class="status-label">いまの状態</p>
          <p id="status-title" class="status-title">木の様子を確認中</p>
          <p id="status-detail" class="status-detail" aria-live="polite">少し待ってください</p>
        </div>

        <div class="actions">
          <button id="water-button" class="water-button" type="button" disabled>
            <span>10秒だけ水をあげる</span>
          </button>
          <button id="stop-button" class="stop-button" type="button" hidden>
            水を止める
          </button>
        </div>

        <p id="action-message" class="action-message" aria-live="polite"></p>
      </section>

      <aside class="rules" aria-label="利用ルール">
        <p><strong>登録不要</strong>で、誰でも押せます。</p>
        <p id="quota-label">使いすぎを防ぐため、少し待つことがあります。</p>
      </aside>
    </main>

    <footer>
      <p>tree.2-38.com</p>
      <p>安全のため、1回の水やりは10秒で止まります。</p>
    </footer>
  </div>
</body>
</html>
